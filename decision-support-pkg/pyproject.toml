[project]
name = "decision-support"
version = "1.0.0"
description = "Structured decision support using the Cynefin framework and Delphi method. Web interface included."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["cynefin", "delphi", "decision", "decision-support", "consensus", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "flask>=3.0",
    "gunicorn>=21.0",
]

[project.scripts]
cynefin      = "decisionsupport.cynefin_cli:main"
delphi       = "decisionsupport.delphi_cli:main"
decision     = "decisionsupport.decision_cli:main"
decision-web = "decisionsupport.web:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decisionsupport"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["decisionsupport"]

[tool.coverage.report]
show_missing = true
