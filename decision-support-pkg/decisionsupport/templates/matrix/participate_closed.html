<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decision Matrix — {{ session.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:480px">
  <div class="card text-center">
    <div class="card-body py-5">
      <h4 class="mb-2">{{ session.title }}</h4>
      <p class="text-muted mb-3">
        {% if session.status == 'setup' %}Scoring has not opened yet.
        {% elif session.status == 'closed' %}Scoring is closed. Results are being reviewed.
        {% else %}This matrix is not currently accepting scores.{% endif %}
      </p>
      <span class="badge bg-secondary">{{ session.status }}</span>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
