<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Decision Support</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }
    .login-card { max-width: 380px; margin: 8vh auto; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h5 class="mb-1 fw-bold">&#9675; Decision Support</h5>
      <p class="text-muted small mb-4">Admin access required</p>

      {% for cat, msg in get_flashed_messages(with_categories=True) %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}

      <form method="post">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="secret" class="form-control" autofocus required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
