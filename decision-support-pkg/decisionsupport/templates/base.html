<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Decision Support{% endblock %} — MemPalace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: -.3px; }
    .domain-clear       { background: #198754 !important; }
    .domain-complicated { background: #0d6efd !important; }
    .domain-complex     { background: #fd7e14 !important; }
    .domain-chaotic     { background: #dc3545 !important; }
    .domain-disorder    { background: #6c757d !important; }
    .score-fill { height: 6px; border-radius: 3px; background: #0d6efd; }
    .score-track { height: 6px; border-radius: 3px; background: #dee2e6; }
    .consensus-yes { color: #198754; font-weight: 600; }
    .consensus-no  { color: #dc3545; }
    .card { border: 1px solid #e3e6ea; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .card-header { background: #fff; border-bottom: 1px solid #e3e6ea; }
    .fw-toggle-btn { font-size: .8rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">&#9675; Decision Support</a>
    <div class="navbar-nav flex-row gap-3 ms-auto align-items-center">
      <a class="nav-link text-white-50 {% if request.path.startswith('/cynefin') %}text-white fw-semibold{% endif %}"
         href="{{ url_for('cynefin_list') }}">Cynefin</a>
      <a class="nav-link text-white-50 {% if request.path.startswith('/delphi') %}text-white fw-semibold{% endif %}"
         href="{{ url_for('delphi_list') }}">Delphi</a>
      <span class="badge rounded-pill
        {% if active_framework == 'cynefin' %}bg-primary{% else %}bg-success{% endif %}
        ms-2">
        {{ active_framework | title }} active
      </span>
      <form method="post" action="{{ url_for('toggle_framework') }}" class="d-inline ms-1">
        <button type="submit" class="btn btn-sm btn-outline-light fw-toggle-btn">&#8645; Toggle</button>
      </form>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% for cat, msg in get_flashed_messages(with_categories=True) %}
  <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
