{% extends "base.html" %}
{% block title %}New PESTLE Session{% endblock %}
{% block content %}

<div class="d-flex align-items-center mb-3 gap-2 small text-muted">
  <a href="{{ url_for('pestle_list') }}" class="text-muted text-decoration-none">&larr; Sessions</a>
</div>

<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header fw-medium"><span class="badge bg-dark me-2">PESTLE</span> New session</div>
      <div class="card-body">
        <form method="post" action="{{ url_for('pestle_new') }}">
          <div class="mb-3">
            <label class="form-label fw-medium">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="title" required
                   placeholder="e.g. Expanding into European markets">
          </div>
          <div class="mb-4">
            <label class="form-label fw-medium">Description <span class="text-muted small">(optional)</span></label>
            <textarea class="form-control" name="description" rows="3"
                      placeholder="Briefly describe the strategic decision or context being analysed…"></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">Create session</button>
            <a href="{{ url_for('pestle_list') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
